<svg width="160" height="44" viewBox="0 0 160 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon mark: open book with A -->
  <g>
    <!-- Left book page -->
    <path d="M4 8 C4 8 4 6 7 6 C10 6 16 7.5 18 9 L18 36 C16 34.5 10 33 7 33 C4 33 4 35 4 35 Z"
          fill="#9C3048" opacity="0.9"/>
    <!-- Right book page -->
    <path d="M34 8 C34 8 34 6 31 6 C28 6 22 7.5 20 9 L20 36 C22 34.5 28 33 31 33 C34 33 34 35 34 35 Z"
          fill="#2A1518"/>
    <!-- Book spine -->
    <rect x="18" y="6" width="2" height="30" fill="#C7A24E" rx="1"/>
    <!-- Stylised A on right page -->
    <path d="M23 30 L26.5 16 L30 30" stroke="#C7A24E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24.2 25 L28.8 25" stroke="#C7A24E" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Bottom line -->
    <path d="M4 35 C4 35 4 37 7 37 C10 37 16 35.5 18 34 L20 34 C22 35.5 28 37 31 37 C34 37 34 35 34 35"
          stroke="#C7A24E" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Brand name text -->
  <!-- "English with" line -->
  <text x="44" y="18" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="600"
        letter-spacing="0.04em" fill="white" opacity="0.85">English with</text>
  <!-- "Aisha" line - larger, gold accent -->
  <text x="44" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700"
        letter-spacing="0.02em" fill="white">Aisha</text>
  <!-- Gold underline accent -->
  <line x1="44" y1="37" x2="96" y2="37" stroke="#C7A24E" stroke-width="1.5" stroke-linecap="round"/>
</svg>
